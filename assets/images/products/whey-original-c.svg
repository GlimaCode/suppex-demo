  <rect x="168" y="212" width="64" height="2" fill="#fff" opacity="0.45"/>
  <text x="200" y="246" text-anchor="middle" font-family="Arial Black, Helvetica, sans-serif"
        font-size="22" font-weight="900" fill="#fff">WHEY</text>
  <text x="200" y="274" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
