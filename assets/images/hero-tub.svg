<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 560" role="img" aria-label="قوطی وی ایزوله ساپکس">
  <defs>
    <linearGradient id="jar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#050506"/>
      <stop offset="0.14" stop-color="#26262B"/>
      <stop offset="0.34" stop-color="#3A3A41"/>
      <stop offset="0.52" stop-color="#191A1E"/>
      <stop offset="0.78" stop-color="#0B0B0D"/>
      <stop offset="1"    stop-color="#020203"/>
    </linearGradient>
    <linearGradient id="lid" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#070708"/>
      <stop offset="0.16" stop-color="#33333A"/>
      <stop offset="0.38" stop-color="#4A4A53"/>
      <stop offset="0.60" stop-color="#1D1D21"/>
      <stop offset="1"    stop-color="#050506"/>
    </linearGradient>
    <linearGradient id="lbl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#2B2B27"/>
      <stop offset="0.45" stop-color="#1B1B19"/>
      <stop offset="1"    stop-color="#121211"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#7E1E1C"/>
      <stop offset="0.5" stop-color="#A52725"/>
      <stop offset="1"   stop-color="#6E1513"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.45" r="0.55">
      <stop offset="0"   stop-color="#F25914" stop-opacity="0.28"/>
      <stop offset="0.6" stop-color="#F25914" stop-opacity="0.07"/>
      <stop offset="1"   stop-color="#F25914" stop-opacity="0"/>
    </radialGradient>
    <filter id="sh" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="17"/>
    </filter>
  </defs>

  <ellipse cx="260" cy="270" rx="235" ry="235" fill="url(#halo)"/>
  <ellipse cx="260" cy="500" rx="150" ry="24" fill="#000" opacity="0.6" filter="url(#sh)"/>

  <!-- lid -->
  <rect x="150" y="74" width="220" height="74" rx="16" fill="url(#lid)"/>
  <ellipse cx="260" cy="80" rx="110" ry="20" fill="#4A4A53" opacity="0.75"/>
  <ellipse cx="260" cy="80" rx="88"  ry="14" fill="#0D0D10" opacity="0.55"/>
  <g fill="#000" opacity="0.34">
    <rect x="150" y="100" width="220" height="4"/>
    <rect x="150" y="114" width="220" height="4"/>
    <rect x="150" y="128" width="220" height="4"/>
  </g>

  <!-- body -->
  <path d="M144 146 h232 a10 10 0 0 1 10 10 v300 a26 26 0 0 1 -26 26 h-200 a26 26 0 0 1 -26 -26 v-300 a10 10 0 0 1 10 -10 z"
        fill="url(#jar)"/>

  <!-- label -->
  <path d="M144 214 h232 v186 h-232 z" fill="url(#lbl)"/>
  <rect x="144" y="238" width="232" height="26" fill="url(#band)"/>
  <rect x="144" y="236" width="232" height="2" fill="#D4453F" opacity="0.7"/>
  <text x="260" y="231" text-anchor="middle" font-family="Arial Black, Helvetica, sans-serif"
        font-size="15" font-weight="900" fill="#B08A55" letter-spacing="6">SUPPEX</text>
  <text x="260" y="257" text-anchor="middle" font-family="Arial Black, Helvetica, sans-serif"
        font-size="13" font-weight="900" fill="#F2E6D8" letter-spacing="3">ISOLATE SERIES</text>
  <text x="260" y="316" text-anchor="middle" font-family="Arial Black, Helvetica, sans-serif"
        font-size="42" font-weight="900" fill="#E8E8E6">WHEY</text>
  <rect x="196" y="330" width="128" height="2" fill="#A07655" opacity="0.85"/>
  <text x="260" y="356" text-anchor="middle" font-family="Arial Black, Helvetica, sans-serif"
        font-size="20" font-weight="900" fill="#C9C9C7" letter-spacing="5">ISOLATE</text>
  <text x="260" y="382" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="12" font-weight="700" fill="#957542" letter-spacing="2">24 G PROTEIN · 900 G</text>

  <!-- specular sheen down the left edge, matching the 3D key light -->
  <path d="M166 152 h26 v322 a22 22 0 0 1 -20 -14 z" fill="#fff" opacity="0.10"/>
  <path d="M340 152 h16 v308 a22 22 0 0 1 -16 16 z" fill="#fff" opacity="0.05"/>
  <rect x="150" y="90" width="18" height="52" rx="8" fill="#fff" opacity="0.13"/>
</svg>
